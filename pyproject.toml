[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeos"
version = "0.1.0"
description = "Agent-first Linux session capability runtime prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "dbus-next>=0.2.3; platform_system == 'Linux'",
  "pydantic>=2.11,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8",
  "ruff>=0.11",
]

[project.scripts]
vibe = "vibeos.cli:main"
vibed = "vibeos.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --showlocals --tb=short --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = [".vibeos"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"src/vibeos/dbus_service.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/vibeos/core",
  "src/vibeos/command_service.py",
  "src/vibeos/task_application.py",
  "src/vibeos/durable_action_executor.py",
  "src/vibeos/durable_task_driver.py",
  "src/vibeos/durable_task_engine.py",
  "src/vibeos/durable_task_lease.py",
  "src/vibeos/durable_task_models.py",
  "src/vibeos/durable_task_planning.py",
  "src/vibeos/durable_task_recovery.py",
  "src/vibeos/durable_task_results.py",
  "src/vibeos/durable_task_resumer.py",
  "src/vibeos/durable_task_support.py",
  "src/vibeos/planning_service.py",
  "src/vibeos/execution_service.py",
  "src/vibeos/review_service.py",
  "src/vibeos/acceptance_service.py",
  "src/vibeos/recovery_service.py",
  "src/vibeos/result_projection.py",
  "src/vibeos/runtime_composition.py",
  "src/vibeos/review_identifiers.py",
  "src/vibeos/tools/registry.py",
]
follow_imports = "skip"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*"]
follow_imports = "normal"
