[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeos"
version = "0.1.0"
description = "Agent-first Linux session capability runtime prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dbus-next>=0.2.3; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
vibe = "vibeos.cli:main"
vibed = "vibeos.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --showlocals --tb=short --strict-config --strict-markers"
